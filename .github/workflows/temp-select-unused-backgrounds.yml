name: Select unused background images

on:
  push:
    paths:
      - '.github/workflows/temp-select-unused-backgrounds.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select unused landscape images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil
          import subprocess

          root = Path('.')
          image_dir = root / 'Image'
          bg_file = root / 'Data' / 'backgrounds.json'
          data = json.loads(bg_file.read_text(encoding='utf-8'))
          pages = list(data.get('pages', {}).keys())

          if not image_dir.is_dir():
              raise SystemExit('Image directory not found')

          identify = shutil.which('identify')
          if not identify:
              raise SystemExit('ImageMagick identify is not available on this runner')

          # Detect image references in text files, excluding backgrounds.json itself.
          used = set()
          pattern = re.compile(r'(?i)(?:Image/|\.\./Image/)([^"\'\s)<>]+)')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == bg_file:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              used.update(m.split('?', 1)[0] for m in pattern.findall(text))

          # Current background assignments are also considered used.
          for value in data.get('pages', {}).values():
              if isinstance(value, str):
                  used.add(Path(value).name)
          if isinstance(data.get('fallback'), str):
              used.add(Path(data['fallback']).name)

          # Background criteria:
          # - unused by the rest of the site
          # - landscape
          # - at least 900x500, enough for a usable responsive background
          # - aspect ratio >= 1.5
          # - <= 8 MiB
          # - file extension must match the actual decoded format
          allowed = {
              '.jpg': {'JPEG'},
              '.jpeg': {'JPEG'},
              '.png': {'PNG'},
              '.webp': {'WEBP'},
          }
          candidates = []

          for path in image_dir.iterdir():
              ext = path.suffix.lower()
              if not path.is_file() or ext not in allowed or path.name in used:
                  continue

              try:
                  result = subprocess.run(
                      [identify, '-format', '%m %w %h', str(path)],
                      capture_output=True,
                      text=True,
                      check=True
                  )
                  fmt, width, height = result.stdout.strip().split()[:3]
                  width, height = int(width), int(height)
              except Exception:
                  continue

              if fmt not in allowed[ext]:
                  continue

              ratio = width / height if height else 0
              size = path.stat().st_size
              pixels = width * height

              if width < 900 or height < 500 or ratio < 1.5 or size > 8 * 1024 * 1024:
                  continue

              # Prefer the highest-resolution images, then wider compositions,
              # then smaller files of comparable quality.
              candidates.append(((pixels, ratio, -size), path.name, width, height))

          candidates.sort(reverse=True)

          if len(candidates) < len(pages):
              print(f'Only {len(candidates)} unused suitable images found for {len(pages)} pages.')
              print('Available candidates:')
              for _, name, width, height in candidates:
                  print(f'  - {name}: {width}x{height}')
              raise SystemExit('Not enough distinct unused suitable backgrounds. No changes made.')

          for page, (_, filename, width, height) in zip(pages, candidates):
              data['pages'][page] = f'Image/{filename}'
              print(f'{page}: {filename} ({width}x{height})')

          data['responsive'] = {
              'description': 'Chaque page utilise une image distincte sélectionnée dans Image parmi les ressources non utilisées.',
              'strategy': 'Paysage, minimum 900x500, ratio >= 1.5, format réel cohérent avec l’extension, poids <= 8 MiB.'
          }

          bg_file.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/temp-select-unused-backgrounds.yml

      - name: Commit background selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/backgrounds.json .github/workflows/temp-select-unused-backgrounds.yml
          git diff --cached --quiet && exit 0
          git commit -m "Select distinct unused page backgrounds"
          git push
