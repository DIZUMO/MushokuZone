name: Select unused background images

on:
  push:
    paths:
      - '.github/workflows/temp-select-unused-backgrounds.yml'

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select unused landscape images with suitable dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil
          import subprocess

          root = Path('.')
          image_dir = root / 'Image'
          bg_file = root / 'Data' / 'backgrounds.json'
          data = json.loads(bg_file.read_text(encoding='utf-8'))
          pages = list(data.get('pages', {}).keys())

          if not image_dir.is_dir():
              raise SystemExit('Image directory not found')

          # Read image dimensions using ImageMagick already available on GitHub runners.
          identify = shutil.which('identify')
          if not identify:
              raise SystemExit('ImageMagick identify is not available on this runner')

          # Find images already referenced by the repository, excluding the background config
          # because those are handled explicitly below.
          used = set()
          image_pattern = re.compile(r'(?i)(?:Image/|\.\./Image/)([^"\'\s)<>]+)')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == bg_file:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for match in image_pattern.findall(text):
                  used.add(match.split('?', 1)[0])

          for value in data.get('pages', {}).values():
              if isinstance(value, str):
                  used.add(Path(value).name)
          if isinstance(data.get('fallback'), str):
              used.add(Path(data['fallback']).name)

          candidates = []
          allowed = {'.jpg', '.jpeg', '.png', '.webp'}

          for path in image_dir.iterdir():
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if path.name in used:
                  continue

              try:
                  result = subprocess.run(
                      [identify, '-format', '%w %h', str(path)],
                      capture_output=True,
                      text=True,
                      check=True
                  )
                  width, height = map(int, result.stdout.strip().split()[:2])
              except Exception:
                  continue

              ratio = width / height if height else 0
              pixels = width * height
              size = path.stat().st_size

              # Suitable for full-page desktop backgrounds.
              if width < 1280 or height < 720 or ratio < 1.5 or size > 8 * 1024 * 1024:
                  continue

              # Prefer large landscape images while keeping file size reasonable.
              score = (pixels, ratio, -size)
              candidates.append((score, path.name, width, height))

          candidates.sort(reverse=True)

          if len(candidates) < len(pages):
              raise SystemExit(
                  f'Not enough unused suitable images: found {len(candidates)}, need {len(pages)}. '
                  'No background assignments were changed.'
              )

          for page, (_, filename, width, height) in zip(pages, candidates):
              data['pages'][page] = f'Image/{filename}'
              print(f'{page}: {filename} ({width}x{height})')

          data['responsive'] = {
              'description': 'Chaque page utilise un fond distinct sélectionné parmi les images non utilisées du dossier Image.',
              'strategy': 'Images paysage d’au moins 1280x720, ratio >= 1.5, poids <= 8 Mo.'
          }

          bg_file.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/temp-select-unused-backgrounds.yml

      - name: Commit background selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/backgrounds.json .github/workflows/temp-select-unused-backgrounds.yml
          git diff --cached --quiet && exit 0
          git commit -m "Use unused suitable images as page backgrounds"
          git push
